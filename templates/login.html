{% extends 'base.html' %}
{% block title %}Log in — NOVA{% endblock %}
{% block content %}
    <section class="auth-layout">
        <div class="auth-intro">
            <p class="eyebrow"><span class="eyebrow-line"></span> Welcome back</p>
            <h1>Return to the <span class="gradient-text">conversation.</span></h1>
            <p class="hero-copy">Your next bright idea is only a few keystrokes away.</p>
            <div class="auth-orbit" aria-hidden="true"><span></span><span></span><span></span></div>
        </div>
        <div class="auth-card glass-card">
            <div class="auth-card-heading">
                <span class="auth-symbol" aria-hidden="true">✦</span>
                <div><p class="section-kicker">NOVA access</p><h2>Log in</h2></div>
            </div>
            <form method="post" class="auth-form">
                <div class="field-group">
                    <label for="username">Username</label>
                    <input id="username" name="username" maxlength="30" autocomplete="username" required>
                </div>
                <div class="field-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <button class="button button-primary button-full" type="submit">Log in <span aria-hidden="true">↗</span></button>
            </form>
            <p class="auth-switch">New to NOVA? <a href="{{ url_for('register') }}">Create an account</a>.</p>
        </div>
    </section>
{% endblock %}
