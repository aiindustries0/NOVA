<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}NOVA{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 760px; margin: 0 auto; padding: 20px; background: #f4f7fb; color: #172033; }
        nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 20px; }
        nav a { color: #2457c5; text-decoration: none; font-weight: bold; }
        main { background: white; padding: 22px; border-radius: 12px; box-shadow: 0 2px 8px #d8deea; }
        textarea, input { width: 100%; box-sizing: border-box; padding: 10px; margin: 6px 0 12px; border: 1px solid #ccd3df; border-radius: 6px; }
        button { background: #2457c5; color: white; border: 0; border-radius: 6px; padding: 9px 14px; cursor: pointer; }
        .post { border-top: 1px solid #e1e5ec; padding: 18px 0; }
        .post:first-child { border-top: 0; }
        .muted { color: #687386; font-size: 0.9em; }
        .flash { background: #e8f0ff; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
        .comment { margin: 8px 0 8px 20px; padding-left: 10px; border-left: 3px solid #d7e2ff; }
        .small-form { display: inline; }
        .small-form button { padding: 5px 9px; font-size: 0.9em; }
    </style>
</head>
<body>
    <nav>
        <div><a href="{{ url_for('index') }}">NOVA</a></div>
        <div>
            {% if logged_in_user %}
                <a href="{{ url_for('profile', username=logged_in_user['username']) }}">{{ logged_in_user['username'] }}</a>
                · <a href="{{ url_for('logout') }}">Log out</a>
            {% else %}
                <a href="{{ url_for('login') }}">Log in</a>
                · <a href="{{ url_for('register') }}">Register</a>
            {% endif %}
        </div>
    </nav>
    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="flash">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    <main>{% block content %}{% endblock %}</main>
</body>
</html>
